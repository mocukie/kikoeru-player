name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # wasm 的 Release 以 wasm/ 的 tree hash 定址：tag 已存在就跳過，否則 build、做 LGPL 檢查與 smoke test 後發布（ADR-0005）。
  ensure-wasm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Resolve release tag
        id: release
        run: |
          tag=$(node scripts/wasm-tag.ts)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # 只把已發布的 Release 當成存在；draft 是之前中途失敗或被取消的發布。
          if [[ $(gh release view "$tag" --json isDraft --jq .isDraft 2> /dev/null) == false ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $tag 已存在，跳過 build。"
          fi
      - name: Restore upstream tarballs
        if: steps.release.outputs.exists != 'true'
        uses: actions/cache@v6
        with:
          path: wasm/.work/downloads
          key: wasm-downloads-${{ hashFiles('wasm/versions.env') }}
      # 包含 LGPL 檢查（config.h）與 smoke test，任一失敗都不發布。
      - name: Build wasm
        if: steps.release.outputs.exists != 'true'
        run: node scripts/wasm-build.ts
      # 先建成 draft、上傳全部檔案後才發布，避免中途失敗留下內容不完整、卻會被當成存在的 Release。
      - name: Publish release
        if: steps.release.outputs.exists != 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          TARGET: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ $(gh release view "$TAG" --json isDraft --jq .isDraft 2> /dev/null) == true ]]; then
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" --draft --latest=false --target "$TARGET" --title "$TAG" \
            --notes "FFmpeg（LGPL-2.1-or-later）的 wasm build，由 \`wasm/\`（tree $(git rev-parse HEAD:wasm)）產生。授權與原始碼見 NOTICE 與 sources.tar。" \
            wasm/.work/release/*
          gh release edit "$TAG" --draft=false --latest=false

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  browser:
    needs: ensure-wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 測試媒體依產生 script 的內容快取；script 沒變就不重新產生。
      - name: Restore test media
        id: media
        uses: actions/cache/restore@v6
        with:
          path: test/media/out
          key: test-media-${{ hashFiles('test/media/gen-media.sh', 'test/media/gen-subs.py') }}
      # 與 pnpm media:gen 相同；這個 job 的 host 不安裝 Node 與 pnpm。
      - name: Generate test media
        if: steps.media.outputs.cache-hit != 'true'
        run: test/media/gen-media.sh ci
      # 產生完立刻存，後面的測試失敗也不必重新產生。
      - name: Save test media
        if: steps.media.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: test/media/out
          key: ${{ steps.media.outputs.cache-primary-key }}
      # 瀏覽器在 Playwright image 內，不另外快取；這裡快取 container 內 pnpm install 用的 store。
      - uses: actions/cache@v6
        with:
          path: ~/.cache/kikoeru-player/docker-pnpm-store
          key: docker-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: docker-pnpm-store-
      - name: Browser mode and E2E (Chromium, Firefox)
        run: test/docker/run.sh sh -c 'pnpm wasm:fetch && pnpm test:browser && pnpm e2e'
