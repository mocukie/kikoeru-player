<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>kikoeru-player Demo</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0 auto;
        max-width: 48rem;
        padding: 1rem;
      }
      fieldset {
        display: grid;
        gap: 0.5rem;
        margin-bottom: 1rem;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: center;
      }
      input[type='url'],
      input[type='text'],
      input[type='range'],
      select {
        flex: 1 1 16rem;
        min-width: 0;
      }
      button {
        padding: 0.4rem 0.9rem;
      }
      dl {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 0.25rem 1rem;
        font-variant-numeric: tabular-nums;
      }
      dt {
        font-weight: 600;
      }
      dd {
        margin: 0;
      }
      #stats-json {
        max-height: 40vh;
        overflow: auto;
        font:
          0.75rem/1.3 ui-monospace,
          monospace;
      }
      #log {
        max-height: 50vh;
        overflow: auto;
        padding-left: 2.5rem;
        font:
          0.8rem/1.4 ui-monospace,
          monospace;
      }
    </style>
  </head>
  <body>
    <h1>kikoeru-player Demo</h1>
    <p id="engine-options"></p>

    <fieldset>
      <legend>來源</legend>
      <div class="row">
        <label for="media">CI 組媒體</label>
        <select id="media"></select>
      </div>
      <div class="row">
        <label for="fault">CI 組媒體的故障注入</label>
        <select id="fault">
          <option value="">無</option>
          <option value="fault=401@4">401@4：播放中 session 失效（之後 reload 可接續）</option>
          <option value="fault=403@1">403@1：開檔時 403</option>
          <option value="fault=410@1">410@1：開檔時 410</option>
          <option value="fault=200@1">200@1：伺服器不回 206</option>
          <option value="fault=503@2">503@2：一次 503，重試後恢復</option>
          <option value="fault=503@2%2B">503@2+：持續 503，重試用完後錯誤</option>
          <option value="fault=drop@500KB">drop@500KB：一次斷線，重試後恢復</option>
          <option value="fault=drop@500KB%2B">drop@500KB+：持續斷線，重試用完後錯誤</option>
          <option value="fault=stall@1MB">stall@1MB：送到 1 MiB 停住一次（卡住後自動恢復）</option>
          <option value="fault=stall@1MB%2B">stall@1MB+：每次都停住（自動恢復用完後錯誤）</option>
          <option value="delay=200">delay=200：每個回應慢 200 ms</option>
          <option value="delay=2000">
            delay=2000：每個回應慢 2 秒（搭配 ?readahead=1 讓網路不足）
          </option>
        </select>
        <input
          id="fault-custom"
          type="text"
          placeholder="或自訂 query，例如 fault=503@2&amp;delay=200（填了就優先使用）"
        />
      </div>
      <div class="row">
        <label for="url">或 URL</label>
        <input id="url" type="url" placeholder="https://…（填了就優先使用）" />
      </div>
      <div class="row">
        <label for="file">或本機檔案</label>
        <input id="file" type="file" />
      </div>
    </fieldset>

    <div class="row">
      <button id="load" type="button">load</button>
      <button id="play" type="button">play</button>
      <button id="pause" type="button">pause</button>
      <button id="reload" type="button">reload</button>
      <button id="unload" type="button">unload</button>
      <button id="destroy" type="button">destroy</button>
      <button id="recreate" type="button">建立新的 Engine</button>
      <button id="unlock" type="button">unlockAudio</button>
      <label><input id="autoplay" type="checkbox" /> load 後直接播放（paused: false）</label>
    </div>
    <div class="row">
      <label
        ><input id="background" type="checkbox" /> 背景播放模組（audioSession 與靜音 anchor）</label
      >
      <label><input id="next-on-ended" type="checkbox" /> 播完接下一首</label>
    </div>
    <div class="row">
      <label for="seek">seek</label>
      <input id="seek" type="range" min="0" max="0" step="0.001" value="0" disabled />
      <output id="seek-time" for="seek">0.000</output>
    </div>
    <div class="row">
      <label for="volume">volume</label>
      <input id="volume" type="range" min="0" max="1" step="0.01" value="1" />
      <output id="volume-value" for="volume">1.00</output>
      <label><input id="muted" type="checkbox" /> muted</label>
    </div>
    <div class="row">
      <label for="rate">playbackRate</label>
      <input id="rate" type="range" min="0.5" max="2" step="0.05" value="1" />
      <output id="rate-value" for="rate">1.00</output>
      <button id="rate-reset" type="button">1.0x</button>
    </div>
    <div class="row">
      <label for="log-level">logLevel</label>
      <select id="log-level">
        <option value="off">不設定 log hook</option>
        <option value="debug">debug</option>
        <option value="info">info</option>
        <option value="warn" selected>warn</option>
        <option value="error">error</option>
      </select>
      <small>改變時以新的 logLevel 建立新的 Engine；Engine 的 log 記進下方的事件 log</small>
    </div>

    <h2>狀態</h2>
    <dl>
      <dt>state</dt>
      <dd id="state">idle</dd>
      <dt>paused</dt>
      <dd id="paused">true</dd>
      <dt>audioUnlocked</dt>
      <dd id="audio-unlocked">false</dd>
      <dt>currentTime</dt>
      <dd id="current-time">0.000</dd>
      <dt>duration</dt>
      <dd id="duration">NaN</dd>
      <dt>buffered</dt>
      <dd id="buffered">—</dd>
      <dt>error</dt>
      <dd id="error">—</dd>
      <dt>media</dt>
      <dd id="media-info">—</dd>
      <dt>audio</dt>
      <dd id="audio-stats">—</dd>
      <dt>cache</dt>
      <dd id="cache-stats">—</dd>
      <dt>network</dt>
      <dd id="network-stats">—</dd>
      <dt>resources</dt>
      <dd id="resources">—</dd>
      <dt>wasm／video</dt>
      <dd id="wasm-video-stats">—</dd>
      <dt>background</dt>
      <dd id="background-state">—</dd>
    </dl>
    <details id="stats-panel">
      <summary>getStats()（每秒更新）</summary>
      <pre id="stats-json">—</pre>
    </details>

    <h2>事件 log <button id="copy-log" type="button">複製</button></h2>
    <ol id="log"></ol>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
